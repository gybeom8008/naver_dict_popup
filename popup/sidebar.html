<!DOCTYPE html>
<!-- 사이드바용. popup.html 과 같은 화면이고, class="sidebar" 만 다르다 (둘을 함께 고칠 것) -->
<html lang="ko" class="sidebar">
<head>
  <meta charset="utf-8">
  <title>네이버 사전</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header id="bar">
    <div id="tabs" role="tablist"></div>
    <div id="actions">
      <button type="button" id="openTab" class="icon" title="새 탭에서 열기" aria-label="새 탭에서 열기">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M6.5 2.5h-3A1.5 1.5 0 0 0 2 4v8.5A1.5 1.5 0 0 0 3.5 14H12a1.5 1.5 0 0 0 1.5-1.5v-3"
                fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M9.5 2.5h4v4M13.5 2.5 7 9" fill="none" stroke="currentColor"
                stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button type="button" id="gear" class="icon" title="설정" aria-label="설정">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="2.3" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <path d="M8 1.3l.9 1.5 1.7-.4.5 1.7 1.7.5-.4 1.7 1.3 1.2-1.3 1.2.4 1.7-1.7.5-.5 1.7-1.7-.4L8 14.7l-.9-1.5-1.7.4-.5-1.7-1.7-.5.4-1.7L2.3 8.5l1.3-1.2-.4-1.7 1.7-.5.5-1.7 1.7.4z"
                fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <div id="perm" class="notice" hidden>
      <span>naver.com 접근 권한이 필요합니다.</span>
      <button type="button" id="permBtn">허용</button>
      <button type="button" id="permHide" class="link" title="닫기">✕</button>
    </div>

    <!-- 사전 아이프레임(#view)은 popup.js 가 이름 표식을 붙여 여기에 만든다 -->

    <div id="overlay" hidden>
      <iframe id="settings" title="설정"></iframe>
    </div>
  </main>

  <script src="../common/defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
